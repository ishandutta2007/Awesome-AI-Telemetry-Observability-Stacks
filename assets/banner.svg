<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes radarPulse {
        0% { r: 10px; opacity: 0.9; }
        50% { opacity: 0.4; }
        100% { r: 90px; opacity: 0; }
      }
      @keyframes radarPulse2 {
        0% { r: 15px; opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { r: 130px; opacity: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -80; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 0.25; }
        75% { opacity: 0.25; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      .telemetry-pulse {
        animation: radarPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: center;
      }
      .telemetry-pulse-2 {
        animation: radarPulse2 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        animation-delay: 1.5s;
        transform-origin: center;
      }
      .dash-flow {
        stroke-dasharray: 6 8;
        animation: flowDash 2.5s linear infinite;
      }
      .dash-flow-fast {
        stroke-dasharray: 4 6;
        animation: flowDash 1.8s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .banner-float {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .scanner {
        animation: scanLine 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Background Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Dynamic Background Scanning Beam -->
  <line class="scanner" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.15"/>

  <!-- Dynamic Trace Circuit Lines (in background) -->
  <g opacity="0.35" fill="none">
    <!-- Left Trace Branch -->
    <path class="dash-flow" d="M -20,160 Q 80,140 180,210 T 320,190" stroke="#38bdf8" stroke-width="2"/>
    <path class="dash-flow-fast" d="M -20,290 C 100,260 160,330 260,300" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Right Trace Branch -->
    <path class="dash-flow" d="M 880,180 Q 980,130 1080,220 T 1220,170" stroke="#818cf8" stroke-width="2"/>
    <path class="dash-flow-fast" d="M 940,310 C 1020,340 1100,260 1220,280" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Arching Span from Bottom -->
    <path class="dash-flow" d="M 220,420 C 350,330 850,330 980,420" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Dynamic Radar / Telemetry Nodes in Corners -->
  <g transform="translate(100, 100)" opacity="0.6">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" class="telemetry-pulse"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#818cf8" stroke-width="1" class="telemetry-pulse-2"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
  </g>

  <g transform="translate(1100, 110)" opacity="0.6">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#c084fc" stroke-width="1.5" class="telemetry-pulse"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#f472b6" stroke-width="1" class="telemetry-pulse-2"/>
    <circle cx="0" cy="0" r="4" fill="#c084fc" filter="url(#subtleGlow)"/>
  </g>

  <g transform="translate(1120, 320)" opacity="0.5">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1" class="telemetry-pulse"/>
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
  </g>

  <g transform="translate(80, 310)" opacity="0.5">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#818cf8" stroke-width="1" class="telemetry-pulse"/>
    <circle cx="0" cy="0" r="3" fill="#818cf8"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <circle cx="-165" cy="0" r="5" fill="#10b981" class="node-pulse"/>
    <text x="-148" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">
      AI OBSERVABILITY &amp; TELEMETRY STACK
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Shadow for maximum readability -->
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#030712" letter-spacing="-0.5" opacity="0.8">
      AWESOME AI TELEMETRY
    </text>
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      AWESOME AI TELEMETRY
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Agent Tracing • LLM Evaluation • OpenTelemetry • Production Monitoring
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Interactive Feature Pills -->
  <g transform="translate(600, 285)">
    <!-- Pill 1: Agent Tracing -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="10" fill="#0284c7" fill-opacity="0.2"/>
      <circle cx="28" cy="26" r="4" fill="#38bdf8"/>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Agent Tracing</text>
      <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Multi-Agent &amp; DAG Graphs</text>
    </g>

    <!-- Pill 2: Automated Evals -->
    <g transform="translate(-225, 0)">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="10" fill="#7c3aed" fill-opacity="0.2"/>
      <circle cx="28" cy="26" r="4" fill="#a855f7"/>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Automated Evals</text>
      <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">LLM-as-a-Judge &amp; RAG</text>
    </g>

    <!-- Pill 3: OpenTelemetry -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="10" fill="#059669" fill-opacity="0.2"/>
      <circle cx="28" cy="26" r="4" fill="#10b981"/>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">OTel-Native Spans</text>
      <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Vendor-Neutral GenAI</text>
    </g>

    <!-- Pill 4: Production Guardrails -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="10" fill="#e11d48" fill-opacity="0.2"/>
      <circle cx="28" cy="26" r="4" fill="#f43f5e"/>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Cost &amp; Safety</text>
      <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Token Spend &amp; Guardrails</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" rx="2"/>
</svg>
